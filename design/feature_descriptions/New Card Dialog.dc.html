<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="design_doc_mode" content="canvas">
<style>
  body { margin: 0; background: #eef1f5; font-family: Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    --bg-page: #f4f6f8; --bg-surface: #ffffff; --bg-track: #f0f3f7; --bg-hover: #f0f3f7;
    --border: #e3e8ef; --border-strong: #d5dbe3; --border-hover: #cfd6df;
    --text-1: #1c2536; --text-2: #4b5565; --text-3: #697586; --text-4: #9aa4b2;
    --primary: #1565c0; --primary-strong: #0d47a1; --primary-bg: #e8f0fb; --on-primary: #ffffff;
    --feature: #1565c0; --bug: #c62828; --chore: #b26a00; --idea: #7b3fa0;
  }
  body:has([data-theme="dark"]) { background: #0b0f15; }
  [data-theme="dark"] {
    --bg-page: #10151c; --bg-surface: #1a212b; --bg-track: #232c38; --bg-hover: #232c38;
    --border: #2a3441; --border-strong: #364152; --border-hover: #455263;
    --text-1: #e6eaf0; --text-2: #9aa4b2; --text-3: #7b8798; --text-4: #5b6674;
    --primary: #5b9be8; --primary-strong: #82b4ef; --primary-bg: #1c2d42; --on-primary: #0d1420;
    --feature: #5b9be8; --bug: #ef9a9a; --chore: #e0b070; --idea: #c39be0;
  }
  ::placeholder { color: var(--text-4, #9aa4b2); opacity: 1; }
  a { color: var(--primary, #1565c0); text-decoration: none; }
  a:hover { color: var(--primary-strong, #0d47a1); text-decoration: underline; }
</style>
</helmet>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#1565c0"></rect>
    <rect x="24" y="20" width="72" height="40" rx="7" fill="#ffffff"></rect>
    <line x1="34" y1="32" x2="60" y2="32" stroke="#1565c0" stroke-width="3" stroke-linecap="round"></line>
    <rect x="34" y="42" width="52" height="10" rx="3" fill="#e8f0fb"></rect>
  </svg>
</template>

<div data-theme="{{ themeName }}" style="min-height: 100vh; box-sizing: border-box; padding: 40px; background: var(--bg-page, #f4f6f8); color: var(--text-1, #1c2536);">

  <div style="display: flex; align-items: flex-start; gap: 56px; flex-wrap: wrap; justify-content: center;">

    <!-- ================= DESKTOP ================= -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3, #697586);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="18" x2="12" y2="21"></line></svg>
        Desktop
      </div>

      <!-- scrim -->
      <div style="width: 560px; height: 780px; border-radius: 16px; background: rgba(16,24,40,0.28); display: grid; place-items: center; overflow: hidden;">
        <!-- dialog -->
        <div style="width: 480px; background: var(--bg-surface, #fff); border: 1px solid var(--border, #e3e8ef); border-radius: 14px; box-shadow: 0 24px 60px rgba(16,24,40,0.28); overflow: hidden; display: flex; flex-direction: column;">

          <!-- header -->
          <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; border-bottom: 1px solid var(--border, #e3e8ef);">
            <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--primary-bg, #e8f0fb); color: var(--primary, #1565c0); flex-shrink: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </span>
            <span style="font-size: 15.5px; font-weight: 700; color: var(--text-1, #1c2536);">New card</span>
            <div style="flex: 1;"></div>
            <button style="display: grid; place-items: center; width: 30px; height: 30px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: var(--text-4, #9aa4b2);" style-hover="background: var(--bg-hover); color: var(--text-1);" title="Close">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
            </button>
          </div>

          <!-- body -->
          <div style="padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px;">

            <!-- title (hero) -->
            <input autofocus placeholder="Card title…" style="height: 46px; padding: 0 12px; border: 1px solid var(--border-strong, #d5dbe3); border-radius: 9px; background: var(--bg-surface, #fff); font-family: inherit; font-size: 17px; font-weight: 600; color: var(--text-1, #1c2536); outline: none; box-sizing: border-box;" style-focus="border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg);" />

            <!-- type pills -->
            <div style="display: flex; flex-direction: column; gap: 7px;">
              <span style="font-size: 12px; font-weight: 600; color: var(--text-2, #4b5565);">Type</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <sc-for list="{{ typesD }}" as="t" hint-placeholder-count="4">
                  <button onClick="{{ t.select }}" style="{{ t.style }}" style-hover="{{ t.hover }}">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ t.dot }}; flex-shrink: 0;"></span>
                    {{ t.label }}
                  </button>
                </sc-for>
              </div>
            </div>

            <!-- body / description -->
            <div style="display: flex; flex-direction: column; gap: 7px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; font-weight: 600; color: var(--text-2, #4b5565);">Description</span>
                <span style="font-size: 11px; color: var(--text-4, #9aa4b2);">Markdown</span>
                <div style="flex: 1;"></div>
                <button onClick="{{ toggleTplD }}" style="{{ tplBtnD }}" style-hover="border-color: var(--primary); color: var(--primary);">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                  {{ tplLabelD }}
                </button>
              </div>
              <textarea onChange="{{ setBodyD }}" value="{{ bodyD }}" placeholder="Describe the goal, context, and tasks — or insert the template." style="min-height: 270px; padding: 13px 14px; border: 1px solid var(--border-strong, #d5dbe3); border-radius: 9px; background: var(--bg-surface, #fff); font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 13.5px; line-height: 1.7; color: var(--text-1, #1c2536); outline: none; resize: vertical; box-sizing: border-box;" style-focus="border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg);"></textarea>
            </div>
          </div>

          <!-- footer -->
          <div style="display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border, #e3e8ef); background: var(--bg-page, #f4f6f8);">
            <span style="font-size: 12px; color: var(--text-3, #697586);">Add to</span>
            <button style="display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px 0 10px; border: 1px solid var(--border, #e3e8ef); background: var(--bg-surface, #fff); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-1, #1c2536);" style-hover="border-color: var(--primary); color: var(--primary);">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--text-4, #9aa4b2);"></span>
              New
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div style="flex: 1;"></div>
            <button style="height: 34px; padding: 0 14px; border: 1px solid var(--border-strong, #d5dbe3); background: var(--bg-surface, #fff); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2, #4b5565); cursor: pointer; font-family: inherit;" style-hover="border-color: var(--border-hover); background: var(--bg-hover);">Cancel</button>
            <button style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: none; background: var(--primary, #1565c0); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--on-primary, #fff); cursor: pointer; font-family: inherit; box-shadow: 0 1px 2px rgba(16,24,40,0.15);" style-hover="background: var(--primary-strong);">
              Create card
              <span style="display: inline-flex; align-items: center; gap: 2px; padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,0.18); font-size: 10.5px; font-weight: 600;">Ctrl+↵</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= MOBILE ================= -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3, #697586);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><line x1="11" y1="18" x2="13" y2="18"></line></svg>
        Mobile
      </div>

      <!-- phone frame -->
      <div style="width: 380px; height: 780px; border-radius: 40px; background: #05070b; padding: 10px; box-shadow: 0 24px 60px rgba(16,24,40,0.28); box-sizing: border-box;">
        <div style="width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: var(--bg-surface, #fff); display: flex; flex-direction: column; position: relative;">

          <!-- status bar -->
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 22px 4px; font-size: 13px; font-weight: 700; color: var(--text-1, #1c2536); flex-shrink: 0;">
            <span>9:41</span>
            <span style="display: flex; align-items: center; gap: 5px; color: var(--text-2, #4b5565);">
              <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><rect x="0" y="12" width="4" height="6" rx="1"></rect><rect x="6" y="8" width="4" height="10" rx="1"></rect><rect x="12" y="4" width="4" height="14" rx="1"></rect><rect x="18" y="0" width="4" height="18" rx="1"></rect></svg>
              <svg width="22" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="20" height="12" rx="3"></rect><rect x="3" y="3" width="15" height="8" rx="1.5" fill="currentColor" stroke="none"></rect><rect x="23" y="5" width="2" height="4" rx="1" fill="currentColor" stroke="none"></rect></svg>
            </span>
          </div>

          <!-- sheet header -->
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; border-bottom: 1px solid var(--border, #e3e8ef); flex-shrink: 0;">
            <button style="height: 40px; padding: 0 6px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: var(--text-2, #4b5565); cursor: pointer;">Cancel</button>
            <div style="flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--text-1, #1c2536);">New card</div>
            <button style="height: 40px; padding: 0 6px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--primary, #1565c0); cursor: pointer;">Create</button>
          </div>

          <!-- scroll body -->
          <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 18px;">

            <!-- title -->
            <input placeholder="Card title…" style="height: 52px; padding: 0 14px; border: 1px solid var(--border-strong, #d5dbe3); border-radius: 11px; background: var(--bg-surface, #fff); font-family: inherit; font-size: 18px; font-weight: 600; color: var(--text-1, #1c2536); outline: none; box-sizing: border-box;" style-focus="border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg);" />

            <!-- type pills (horizontal scroll) -->
            <div style="display: flex; flex-direction: column; gap: 9px;">
              <span style="font-size: 12px; font-weight: 600; color: var(--text-2, #4b5565);">Type</span>
              <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;">
                <sc-for list="{{ typesM }}" as="t" hint-placeholder-count="4">
                  <button onClick="{{ t.select }}" style="{{ t.style }}">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ t.dot }}; flex-shrink: 0;"></span>
                    {{ t.label }}
                  </button>
                </sc-for>
              </div>
            </div>

            <!-- description -->
            <div style="display: flex; flex-direction: column; gap: 9px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; font-weight: 600; color: var(--text-2, #4b5565);">Description</span>
                <div style="flex: 1;"></div>
                <button onClick="{{ toggleTplM }}" style="{{ tplBtnM }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                  {{ tplLabelM }}
                </button>
              </div>
              <textarea onChange="{{ setBodyM }}" value="{{ bodyM }}" placeholder="Describe the goal, context, and tasks…" style="min-height: 260px; padding: 13px 14px; border: 1px solid var(--border-strong, #d5dbe3); border-radius: 11px; background: var(--bg-surface, #fff); font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 13.5px; line-height: 1.7; color: var(--text-1, #1c2536); outline: none; resize: none; box-sizing: border-box;" style-focus="border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg);"></textarea>
            </div>
          </div>

          <!-- sticky footer -->
          <div style="flex-shrink: 0; border-top: 1px solid var(--border, #e3e8ef); background: var(--bg-page, #f4f6f8); padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
            <button style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid var(--border, #e3e8ef); background: var(--bg-surface, #fff); border-radius: 11px; cursor: pointer; font-family: inherit;">
              <span style="font-size: 13px; color: var(--text-3, #697586);">Add to</span>
              <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--text-4, #9aa4b2);"></span>
              <span style="font-size: 14px; font-weight: 600; color: var(--text-1, #1c2536);">New</span>
              <div style="flex: 1;"></div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-3, #697586)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <button style="height: 50px; border: none; border-radius: 12px; background: var(--primary, #1565c0); color: var(--on-primary, #fff); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,0.15);" style-hover="background: var(--primary-strong);">Create card</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- theme toggle -->
  <button onClick="{{ toggleTheme }}" style="position: fixed; top: 16px; right: 16px; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--border, #e3e8ef); background: var(--bg-surface, #fff); border-radius: 16px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-2, #4b5565); cursor: pointer; z-index: 10;">{{ themeIcon }} {{ themeLabel }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1040, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { dark: false, typeD: 0, typeM: 0, bodyD: '', bodyM: '' };

  buildTypes(active, onSelect, dense) {
    const defs = [
      { label: 'Feature', dot: 'var(--feature)' },
      { label: 'Bug', dot: 'var(--bug)' },
      { label: 'Chore', dot: 'var(--chore)' },
      { label: 'Idea', dot: 'var(--idea)' },
    ];
    const base = `display: inline-flex; align-items: center; gap: 7px; height: ${dense ? 40 : 34}px; padding: 0 ${dense ? 16 : 13}px; border-radius: 99px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; border: 1px solid transparent; transition: all 0.12s;`;
    return defs.map((d, i) => {
      const on = i === active;
      return {
        label: d.label, dot: d.dot,
        style: base + (on
          ? ' background: var(--primary-bg, #e8f0fb); color: var(--primary, #1565c0); border-color: var(--primary, #1565c0);'
          : ' background: var(--bg-track, #f0f3f7); color: var(--text-2, #4b5565);'),
        hover: on ? '' : 'background: var(--bg-hover); color: var(--text-1); border-color: var(--border-strong);',
        select: () => onSelect(i),
      };
    });
  }

  tplBtn(inserted, dense) {
    const base = `display: inline-flex; align-items: center; gap: 6px; height: ${dense ? 32 : 28}px; padding: 0 10px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; transition: all 0.12s;`;
    return inserted
      ? base + ' border: 1px solid var(--primary); color: var(--primary); background: var(--primary-bg);'
      : base + ' border: 1px solid var(--border-strong, #d5dbe3); color: var(--text-2, #4b5565); background: var(--bg-surface, #fff);';
  }

  get TEMPLATE() {
    return '## Goal\nWhy this card exists.\n\n## Current status\nWhere things stand.\n\n## Details\nContext, links, constraints.\n\n## Tasks\n- [ ] First step';
  }

  renderVals() {
    const dark = this.state.dark;
    const insertedD = this.state.bodyD === this.TEMPLATE;
    const insertedM = this.state.bodyM === this.TEMPLATE;

    const sun = React.createElement('svg', { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' },
      React.createElement('circle', { cx: 12, cy: 12, r: 4.5 }),
      React.createElement('path', { d: 'M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2' }));
    const moon = React.createElement('svg', { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
      React.createElement('path', { d: 'M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z' }));

    return {
      themeName: dark ? 'dark' : 'light',
      themeIcon: dark ? sun : moon,
      themeLabel: dark ? 'Light' : 'Dark',
      toggleTheme: () => this.setState(s => ({ dark: !s.dark })),

      typesD: this.buildTypes(this.state.typeD, (i) => this.setState({ typeD: i }), false),
      typesM: this.buildTypes(this.state.typeM, (i) => this.setState({ typeM: i }), true),

      bodyD: this.state.bodyD,
      bodyM: this.state.bodyM,
      setBodyD: (e) => this.setState({ bodyD: e.target.value }),
      setBodyM: (e) => this.setState({ bodyM: e.target.value }),

      tplBtnD: this.tplBtn(insertedD, false),
      tplBtnM: this.tplBtn(insertedM, true),
      tplLabelD: insertedD ? 'Clear' : 'Template',
      tplLabelM: insertedM ? 'Clear' : 'Template',
      toggleTplD: () => this.setState(s => ({ bodyD: s.bodyD === this.TEMPLATE ? '' : this.TEMPLATE })),
      toggleTplM: () => this.setState(s => ({ bodyM: s.bodyM === this.TEMPLATE ? '' : this.TEMPLATE })),
    };
  }
}
</script>
</body>
</html>
