title: md² documentation
description: Coordinate coding agents and track AI-assisted work, usage, and estimated cost by feature.
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
exclude:
  - _site
  - Gemfile
  - Gemfile.lock
